name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: '1'

jobs:
  synthetic-regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        runtime:
          - node: '22'
            python: '3.10'
          - node: '24'
            python: '3.13'
    runs-on: ${{ matrix.os }}
    steps:
      # Pin official actions to verified commits, not moving branches.
      # 官方 Actions 固定到已核实的提交，而非会变化的分支。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.runtime.node }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.runtime.python }}
      - run: python -m pip install -r requirements.txt
      - run: npm test
      - run: python -m unittest discover -s tests -p "test_*.py" -v
      - run: python scripts/demo_pipeline.py --output work/demo
      - run: python scripts/check_docs.py .
      - run: python scripts/release_audit.py . --report work/release_audit.json
